name: Remove v1.5.5 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/delete-v155-release.yml

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete v1.5.5 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.5.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v1.5.5 --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
          else
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.5.5" >/dev/null 2>&1 || true
          fi

          if gh release view v1.5.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.5.5 release still exists" >&2
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.5.5" >/dev/null 2>&1; then
            echo "v1.5.5 tag still exists" >&2
            exit 1
          fi

      - name: Remove one-time cleanup workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PATH_IN_REPO=".github/workflows/delete-v155-release.yml"
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$PATH_IN_REPO?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$PATH_IN_REPO" \
            -f message="清理一次性 v1.5.5 Release 删除工作流" \
            -f sha="$SHA" \
            -f branch="main" >/dev/null
