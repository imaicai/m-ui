name: Build Release ZIP

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "本版本说明（留空则使用项目简介）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: m-ui-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=m-ui-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.existing.outputs.exists != 'true'
        run: go test ./...

      - name: Build Linux amd64 server
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o /tmp/m-ui-server .

      - name: Package ZIP
        if: steps.existing.outputs.exists != 'true'
        env:
          NAME: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="dist/$NAME"
          mkdir -p "$ROOT"

          cp README.md LICENSE VERSION Makefile go.mod go.sum "$ROOT/"
          cp ./*.go "$ROOT/"
          cp install.sh uninstall.sh m-ui m-ui-ctl "$ROOT/"
          cp -R web "$ROOT/"
          install -m 0755 /tmp/m-ui-server "$ROOT/m-ui-server-linux-amd64"

          (
            cd dist
            zip -qr "$NAME.zip" "$NAME"
          )
          sha256sum "dist/$NAME.zip" > "dist/$NAME.zip.sha256"

      - name: Prepare release notes
        if: steps.existing.outputs.exists != 'true'
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(printf '%s' "$RELEASE_NOTES" | tr -d '[:space:]')" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > /tmp/release-notes.md
          else
            cat > /tmp/release-notes.md <<'EOF'
          M-Ui 是一个面向个人服务器的轻量级 Xray 管理面板，默认采用 VLESS + RAW + REALITY + XTLS Vision，提供节点管理、订阅管理、运行监控、系统设置和 SSH 管理等功能。

          本 Release 提供正式 ZIP 打包文件及 SHA256 校验文件。
          EOF
          fi

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/$NAME.zip" \
            "dist/$NAME.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "M-Ui v$VERSION" \
            --notes-file /tmp/release-notes.md
