name: m-ui CI

on:
  push:
    branches:
      - main
      - 'fix-*'
      - 'release-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install current Xray
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/XTLS/Xray-install/raw/main/install-release.sh -o /tmp/install-xray.sh
          sudo bash /tmp/install-xray.sh install -u root

      - name: Go tests with real Xray config validation
        shell: bash
        run: |
          set -euo pipefail
          XRAY_INTEGRATION=1 go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Frontend syntax
        run: node --check web/assets/app.js

      - name: Xray HandlerService hot-reload smoke test
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop xray || true
          cat >/tmp/mui-api-smoke.json <<'JSON'
          {
            "log": {"loglevel": "warning"},
            "api": {"tag": "api", "services": ["HandlerService"]},
            "inbounds": [
              {
                "listen": "127.0.0.1",
                "port": 19085,
                "protocol": "dokodemo-door",
                "tag": "api-in",
                "settings": {"address": "127.0.0.1"}
              }
            ],
            "outbounds": [{"protocol": "freedom", "tag": "direct"}],
            "routing": {
              "rules": [
                {"type": "field", "inboundTag": ["api-in"], "outboundTag": "api"}
              ]
            }
          }
          JSON
          cat >/tmp/mui-add-inbound.json <<'JSON'
          {
            "inbounds": [
              {
                "listen": "127.0.0.1",
                "port": 19088,
                "protocol": "dokodemo-door",
                "tag": "m-ui-ci-hot",
                "settings": {"address": "127.0.0.1"}
              }
            ]
          }
          JSON
          /usr/local/bin/xray run -config /tmp/mui-api-smoke.json >/tmp/mui-xray-smoke.log 2>&1 &
          XRAY_PID=$!
          trap 'kill "$XRAY_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            /usr/local/bin/xray api lsi --server=127.0.0.1:19085 >/tmp/mui-lsi-before.json 2>/dev/null && break
            sleep 0.2
          done
          /usr/local/bin/xray api adi --server=127.0.0.1:19085 /tmp/mui-add-inbound.json
          /usr/local/bin/xray api lsi --server=127.0.0.1:19085 | grep -q 'm-ui-ci-hot'
          /usr/local/bin/xray api rmi --server=127.0.0.1:19085 m-ui-ci-hot
          ! /usr/local/bin/xray api lsi --server=127.0.0.1:19085 | grep -q 'm-ui-ci-hot'
          kill "$XRAY_PID"
          wait "$XRAY_PID" || true
          trap - EXIT

      - name: Frontend event and security assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path("web/assets/app.js").read_text(encoding="utf-8")
          server = Path("server.go").read_text(encoding="utf-8")
          store = Path("store.go").read_text(encoding="utf-8")
          xray = Path("xray.go").read_text(encoding="utf-8")
          main = Path("main.go").read_text(encoding="utf-8")
          index = Path("web/index.html").read_text(encoding="utf-8")

          for selector in [
              "$$('[data-route]').forEach",
              "$$('.copy-uri').forEach",
              "$$('.copy-sub').forEach",
              "$$('.toggle-sub').forEach",
              "$$('.edit-sub').forEach",
              "$$('.delete-sub').forEach",
          ]:
              assert selector in app
          assert re.search(r"(?<!\$)\$\('\[data-route\]'\)\.forEach", app) is None
          assert "$$$(" not in app

          assert 'id="setPort"' in app
          assert "panel_port:Number($('#setPort').value)" in app
          assert 'id="stableUptime"' in app and '累计稳定运行' in app
          assert 'id="panelUptime"' not in app
          assert 'id="restartPanelSidebar"' in app
          assert 'M-Ui：最简单的代理面板' in app
          assert '小飞机：最简单的代理客户端' in app
          assert 'X-MUI-CSRF' in app and "mui_csrf" in app
          assert "v=1.5.0" in app
          assert "v=1.5.0" in index

          assert 'HandlerService' in xray
          assert 'StatsService' in xray
          assert 'tcpKeepAliveIdle' in xray
          assert 'tcpKeepAliveInterval' in xray
          assert 'func (x *XrayManager) HotApply(old, next AppState) error' in xray
          assert 'func (x *XrayManager) EnsureRunningConfig(st AppState) error' in xray
          assert 'func secureXrayConfig(path string) error' in xray
          assert 'realityFallbackLimit' in xray
          assert 'waitHealthy' in xray
          assert 'os.WriteFile(tmp, b, 0600)' in xray

          assert 'X-MUI-CSRF' in server
          assert 'requestSameOrigin' in server
          assert 'Strict-Transport-Security' in server
          assert 'len(v) < 20' in server
          assert 'tryCloseFirewall' in server
          assert 'HotApply(old, next)' in server
          assert 'passwordNeedsUpgrade' in server

          assert 'golang.org/x/crypto/argon2' in store
          assert '$argon2id$' in store
          assert 'legacyPasswordKDF' in store
          assert 'stateVersion = 6' in store
          assert 'EnsureRunningConfig' in main
          assert '//go:embed VERSION' in main
          PY

      - name: Shell and install safety assertions
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n m-ui
          bash -n m-ui-ctl
          bash -n uninstall.sh
          grep -q 'ExecStart=$SERVER_BIN' install.sh
          grep -q 'SERVER_BIN="/usr/local/bin/m-ui-server"' install.sh
          grep -q 'od -An -N18 -tx1 /dev/urandom' install.sh
          grep -q 'MUI_XRAY_REFRESH' install.sh
          grep -q 'xray-version.lock' install.sh
          grep -q 'tcp_mtu_probing=1' install.sh
          grep -q 'NoNewPrivileges=true' install.sh
          grep -q 'XRAY_RUN_USER' install.sh
          grep -q '恢复上一版本' install.sh
          grep -q '完整更新 m-ui 【前端、后端、脚本、Xray】' m-ui
          grep -q '一键原版BBR+FQ加速' m-ui
          grep -q 'tcp_mtu_probing=1' m-ui
          grep -q '^1\.5\.0$' VERSION
