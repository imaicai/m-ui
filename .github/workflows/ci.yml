name: m-ui CI

on:
  push:
    branches:
      - main
      - 'fix-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install current Xray
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/XTLS/Xray-install/raw/main/install-release.sh -o /tmp/install-xray.sh
          sudo bash /tmp/install-xray.sh install -u root

      - name: Go tests with real Xray config validation
        shell: bash
        run: |
          set -euo pipefail
          XRAY_INTEGRATION=1 go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Frontend syntax
        run: node --check web/assets/app.js

      - name: Frontend event binding assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path("web/assets/app.js").read_text(encoding="utf-8")
          assert "$$('[data-route]').forEach" in s
          assert "$$('.copy-uri').forEach" in s
          assert re.search(r"(?<!\$)\$\('\[data-route\]'\)\.forEach", s) is None
          assert re.search(r"(?<!\$)\$\('\.copy-uri'\)\.forEach", s) is None
          PY

      - name: Panel port and brand assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path("web/assets/app.js").read_text(encoding="utf-8")
          server = Path("server.go").read_text(encoding="utf-8")
          assert 'id="setPort"' in app
          assert "panel_port:Number($('#setPort').value)" in app
          assert "function brandName()" in app
          assert "/api/panel-info" in app
          assert 'panelMux.HandleFunc("/api/panel-info"' in server
          assert 'PanelPort       int' in server
          assert 'replaceServicePanelPort' in server
          PY

      - name: Shell syntax
        shell: bash
        run: |
          bash -n install.sh
          bash -n m-ui
          bash -n m-ui-ctl
          bash -n uninstall.sh
          grep -q 'ExecStart=$SERVER_BIN' install.sh
          grep -q 'SERVER_BIN="/usr/local/bin/m-ui-server"' install.sh
          grep -q '一键原版BBR+FQ加速' m-ui
          grep -q '完整更新 m-ui 【前端、后端、脚本、Xray】' m-ui
          grep -q 'update_program()' m-ui
          grep -q 'ADMIN_USER="${MUI_ADMIN_USER:-minijet}"' install.sh
          grep -q 'NEW_PASSWORD="${MUI_ADMIN_PASS:-minijet}"' install.sh
          grep -q 'PANEL_PORT="${MUI_PORT:-16800}"' install.sh
          grep -q 'MUI_CERT_HOME' install.sh
          grep -q 'defaultCertFile()' store.go
          grep -q '#00B176' web/assets/app.css
          ! grep -q 'value="admin"' web/assets/app.js
          ! grep -q '>复制</button>' web/assets/app.js
          ! grep -q '>编辑</button>' web/assets/app.js
          ! grep -q '>删除</button>' web/assets/app.js
          grep -q 'https://github.com/imaicai/m-ui' web/assets/app.js
          grep -q 'openEditSubscription' web/assets/app.js
          test -s web/assets/app-icon.png
          grep -q 'brand-image' web/assets/app.js
          grep -q 'page-heading-inline' web/assets/app.js
          grep -q 'subscription-guide' web/assets/app.js
          ! grep -q 'id="quickAdd"' web/assets/app.js
          ! grep -q 'icon-add' web/assets/app.js
          grep -q 'new-node-btn' web/assets/app.js
          grep -q 'v1.4.1 refined UI' web/assets/app.css
          grep -q 'v1.4.2 toolbar and restart refinement' web/assets/app.css
          grep -q '管理员账号：' web/assets/app.js
          grep -q 'restartPanelTop' web/assets/app.js
          grep -q 'restartPanelSettings' web/assets/app.js
          grep -Fq "$('[data-route]').forEach" web/assets/app.js

          ! grep -Fq "\$('[data-route]').forEach" web/assets/app.js
          grep -q '+新建节点' web/assets/app.js
          grep -q 'github-link' web/assets/app.js
          grep -q '/api/system/restart' server.go
          grep -q 'assets/favicon.ico' web/index.html
          test -s web/assets/favicon.ico
